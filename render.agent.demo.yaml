services:
  - type: web
    name: archwell-agent-workspace-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn agent_app_demo:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: AGENT_DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.0"
