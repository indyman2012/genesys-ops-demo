services:
  - type: web
    name: archwell-agent-workspace-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn agent_app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: AGENT_DEMO_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.0"
      # Set in Render dashboard (never commit secrets):
      # GENESYS_AGENT_CLIENT_ID, GENESYS_AGENT_CLIENT_SECRET,
      # GENESYS_AGENT_REDIRECT_URI, FLASK_SECRET_KEY, GENESYS_CLOUD_REGION
