name: Build and deploy Python app to Azure Web App - GenesysToolkit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify application files
        run: |
          echo "Repository root:"
          pwd

          echo "Root contents:"
          ls -la

          echo "Looking for GenesysToolkit entry point:"
          find . -maxdepth 4 -name "genesys_toolkit_app.py" -print

          echo "Verifying entry point exists at repository root:"
          test -f ./genesys_toolkit_app.py

          echo "Verifying requirements.txt exists:"
          test -f ./requirements.txt

      - name: Create virtual environment and validate dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python application import
        run: |
          source antenv/bin/activate
          python -c "from genesys_toolkit_app import app; print('genesys_toolkit_app imported successfully')"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.git/
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Verify deployment artifact
        run: |
          echo "Deployment directory:"
          pwd

          echo "Deployment contents:"
          ls -la

          echo "Locating GenesysToolkit entry point:"
          find . -maxdepth 4 -name "genesys_toolkit_app.py" -print

          echo "Verifying entry point is at deployment root:"
          test -f ./genesys_toolkit_app.py

          echo "Verifying requirements.txt:"
          test -f ./requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C78986DBF3D24C199F25931A83DBF824 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6ABC82BAA433443C8EF7F9A46B0305E2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D86DC3CF37F947E99EFB1D7955A3B5C1 }}

      - name: Deploy to GenesysToolkit
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GenesysToolkit
          slot-name: Production
          package: .
