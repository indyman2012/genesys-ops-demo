name: Build and deploy Python app to Azure Web App - GenesysToolkit

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "archive/**"
      - "outputs/**"
      - "logs/**"
      - "scripts/probes/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stage curated web app bundle (hub launcher)
        run: python scripts/stage_azure_webapp.py --output-dir azure-bundle

      - name: Verify bundle layout
        run: |
          test -f azure-bundle/genesys_toolkit_app.py
          test -f azure-bundle/startup.sh
          test -f azure-bundle/requirements.txt
          test -f azure-bundle/app/web_apps_catalog.py
          test -f azure-bundle/templates/ops/hub.html
          test -f azure-bundle/static/ops/hub.css
          chmod +x azure-bundle/startup.sh
          echo "Bundle file count:"
          find azure-bundle -type f | wc -l

      - name: Validate dependencies and import
        working-directory: azure-bundle
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from genesys_toolkit_app import app; print('genesys_toolkit_app imported OK')"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: azure-bundle/
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Verify deployment artifact
        run: |
          test -f ./genesys_toolkit_app.py
          test -f ./startup.sh
          test -f ./requirements.txt
          test -f ./templates/ops/hub.html
          chmod +x ./startup.sh
          find . -maxdepth 3 -type f | head -30

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C78986DBF3D24C199F25931A83DBF824 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6ABC82BAA433443C8EF7F9A46B0305E2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D86DC3CF37F947E99EFB1D7955A3B5C1 }}

      - name: Deploy to GenesysToolkit
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GenesysToolkit
          slot-name: Production
          package: .
