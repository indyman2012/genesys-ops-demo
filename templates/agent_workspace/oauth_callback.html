<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signed in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='archwell/shell.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='agent_workspace/agent.css') }}?v=12">
</head>
<body class="agent-page">
  <div class="app-shell">
    <section class="auth-gate">
      <div class="card auth-gate-card">
        <h2>Signed in</h2>
        <p class="auth-gate-copy">Welcome, {{ user_name }}. This window will close automatically.</p>
      </div>
    </section>
  </div>
  <script>
    (function () {
      if (window.opener) {
        window.opener.postMessage({ type: "genesys-oauth-success" }, window.location.origin);
      }
      window.setTimeout(function () { window.close(); }, 600);
    })();
  </script>
</body>
</html>
