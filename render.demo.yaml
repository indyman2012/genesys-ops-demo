services:
  - type: web
    name: genesys-ops-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ops_app_demo:app --bind 0.0.0.0:$PORT --timeout 600
    envVars:
      - key: OPS_DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GENESYS_CLIENT_ID
        sync: false
      - key: GENESYS_CLIENT_SECRET
        sync: false
      - key: GENESYS_REGION
        value: usw2
      # Site picker at /site-picker — copy GENESYS_AGENT_* from genesys-agent-pilot if needed:
      # GENESYS_AGENT_CLIENT_ID
      # GENESYS_AGENT_CLIENT_SECRET
      # GENESYS_AGENT_USE_PKCE=0   (match agent-pilot OAuth client)
      # Register redirect: https://THIS-SERVICE.onrender.com/site-picker/oauth/callback
