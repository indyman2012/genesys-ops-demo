services:
  - type: web
    name: genesys-toolkit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn genesys_toolkit_app:app --bind 0.0.0.0:$PORT --timeout 600
    # Dashboard: set Health Check Path to /health/live (avoids Genesys call on every deploy probe).
    healthCheckPath: /health/live
    envVars:
      - key: OPS_DEMO_MODE
        value: "1"
      # Live Genesys at /agent (queues, joined). Ops console stays dry-run.
      - key: AGENT_DEMO_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GENESYS_REGION
        value: usw2
      - key: FLASK_SECRET_KEY
        sync: false
      # Client Credentials OAuth client (Queue Performance, Not Responding, ops tools)
      - key: GENESYS_CLIENT_ID
        sync: false
      - key: GENESYS_CLIENT_SECRET
        sync: false
      # Authorization-code OAuth client (site-picker / agent sign-in — different grant)
      - key: GENESYS_AGENT_CLIENT_ID
        sync: false
      - key: GENESYS_AGENT_CLIENT_SECRET
        sync: false
      # Optional: GENESYS_AGENT_USE_PKCE=0 if agent OAuth client has no secret
      # Register redirect: https://YOUR-SERVICE.onrender.com/site-picker/oauth/callback
