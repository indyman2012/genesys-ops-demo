services:
  - type: web
    name: genesys-ops-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn ops_app_demo:app --bind 0.0.0.0:$PORT --timeout 600
    envVars:
      - key: OPS_DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: GENESYS_CLIENT_ID
        sync: false
      - key: GENESYS_CLIENT_SECRET
        sync: false
      - key: GENESYS_REGION
        value: usw2
      # Site picker at /site-picker (also needs agent OAuth for sign-in):
      # GENESYS_AGENT_CLIENT_ID
      # GENESYS_AGENT_CLIENT_SECRET
      # FLASK_SECRET_KEY
      # OAuth redirect (auto if omitted): https://YOUR-SERVICE.onrender.com/site-picker/oauth/callback
